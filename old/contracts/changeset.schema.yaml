# Предложение изменения документов. Декларативный контракт; исполнение принадлежит Knowledge.
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://trellis.local/framework/contracts/changeset.schema.yaml
title: "Предложение изменения документов"
type: object
additionalProperties: false
required:
  - id
  - base_revision
  - framework_revision
  - reason
  - operations
properties:
  id:
    $ref: "common.schema.yaml#/$defs/id"
  base_revision:
    type: string
    minLength: 1
    pattern: "\\S"
    description: "Непрозрачный идентификатор согласованного исходного снимка документов."
  framework_revision:
    type: string
    minLength: 1
    pattern: "\\S"
    description: "Точная ревизия конфигурации, схем, агентов и рендера, использованных при подготовке."
  reason:
    type: string
    minLength: 1
    pattern: "\\S"
    description: "Причина изменения, понятная человеку."
  operations:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required:
        - op
        - path
        - document_id
      properties:
        op:
          type: string
          enum:
            - add
            - replace
            - remove
          description: "Операция над целым документом."
        path:
          type: string
          minLength: 1
          pattern: "\\S"
          description: "Путь относительно корня документов; только /; выход за корень запрещён."
        document_id:
          $ref: "common.schema.yaml#/$defs/id"
        document:
          type: object
          description: "Полный новый документ. Доменная схема выбирается по type при проверке итогового набора."
      allOf:
        -
          if:
            properties:
              op:
                enum:
                  - add
                  - replace
            required:
              - op
          then:
            required:
              - document
            properties:
              document: {}
        -
          if:
            properties:
              op:
                const: remove
            required:
              - op
          then:
            not:
              required:
                - document
              properties:
                document: {}
