# Исходное описание одного пакета агента; запуск и оценка гейтов принадлежат Tasks и Runtime.
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://trellis.local/framework/contracts/agent-package.schema.yaml
title: "Пакет атомарного агента"
type: object
additionalProperties: false
required:
  - format_version
  - id
  - domain
  - instructions
  - executor
  - input
  - output
  - skills
  - gates
properties:
  format_version:
    const: "1"
  id:
    type: string
    pattern: "^[a-z][a-z0-9-]*(\\.[a-z][a-z0-9-]*)+$"
    description: "Глобальное имя пакета; не предоставляет доступ к проекту."
  domain:
    type: string
    pattern: "^[a-z][a-z0-9-]*$"
    description: "Домен результата."
  instructions:
    const: AGENTS.md
    description: "Инструкция ограниченной задачи рядом с agent.yaml."
  executor:
    type: object
    additionalProperties: false
    required:
      - adapter
    properties:
      adapter:
        type: string
        pattern: "^[a-z][a-z0-9-]*$"
        description: "Требуемый адаптер Runtime; не содержит секретов или кода исполнителя."
  input:
    $ref: "#/$defs/schema-link"
  output:
    $ref: "#/$defs/schema-link"
  skills:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      $ref: "#/$defs/local-link"
  gates:
    type: array
    minItems: 2
    items:
      oneOf:
        - $ref: "#/$defs/input-gate"
        - $ref: "#/$defs/output-gate"
        - $ref: "#/$defs/changeset-gate"
        - $ref: "#/$defs/branch-gate"
        - $ref: "#/$defs/changed-paths-gate"
        - $ref: "#/$defs/revision-gate"
    allOf:
      - contains:
          type: object
          properties:
            check:
              const: input_schema
          required:
            - check
        minContains: 1
        maxContains: 1
      - contains:
          type: object
          properties:
            check:
              const: output_schema
          required:
            - check
        minContains: 1
        maxContains: 1
$defs:
  local-link:
    type: string
    minLength: 1
    pattern: "\\S"
    description: "Путь относительно определяющего файла; разрешается только внутри Framework."
  schema-link:
    type: object
    additionalProperties: false
    required:
      - schema
    properties:
      schema:
        $ref: "#/$defs/local-link"
  gate-id:
    type: string
    pattern: "^[a-z][a-z0-9-]*$"
  data-pointer:
    type: string
    pattern: "^/"
    description: "JSON Pointer к полю входа или структурированного результата задачи, согласно типу гейта."
  skill-name:
    type: string
    pattern: "^[a-z][a-z0-9-]*$"
  input-gate:
    type: object
    additionalProperties: false
    required:
      - id
      - phase
      - check
    properties:
      id:
        $ref: "#/$defs/gate-id"
      phase:
        const: before_run
      check:
        const: input_schema
  output-gate:
    type: object
    additionalProperties: false
    required:
      - id
      - phase
      - check
    properties:
      id:
        $ref: "#/$defs/gate-id"
      phase:
        const: before_complete
      check:
        const: output_schema
  changeset-gate:
    type: object
    additionalProperties: false
    required:
      - id
      - phase
      - check
      - value
    properties:
      id:
        $ref: "#/$defs/gate-id"
      phase:
        const: before_complete
      check:
        const: knowledge_changeset_valid
      value:
        $ref: "#/$defs/data-pointer"
  branch-gate:
    type: object
    additionalProperties: false
    required:
      - id
      - phase
      - check
      - changeset
      - proposal
    properties:
      id:
        $ref: "#/$defs/gate-id"
      phase:
        const: before_complete
      check:
        const: knowledge_branch_matches_changeset
      changeset:
        $ref: "#/$defs/data-pointer"
      proposal:
        $ref: "#/$defs/data-pointer"
  changed-paths-gate:
    type: object
    additionalProperties: false
    required:
      - id
      - phase
      - check
      - allowed
      - proposal
    properties:
      id:
        $ref: "#/$defs/gate-id"
      phase:
        const: before_complete
      check:
        const: knowledge_changed_paths_allowed
      allowed:
        $ref: "#/$defs/data-pointer"
        description: "JSON Pointer к спискам разрешённых путей и префиксов во входе задачи."
      proposal:
        $ref: "#/$defs/data-pointer"
  revision-gate:
    type: object
    additionalProperties: false
    required:
      - id
      - phase
      - check
      - skill
      - proposal
    properties:
      id:
        $ref: "#/$defs/gate-id"
      phase:
        const: before_complete
      check:
        const: knowledge_revision_valid
      skill:
        $ref: "#/$defs/skill-name"
        description: "Навык с единственной доменной схемой изменённых документов."
      proposal:
        $ref: "#/$defs/data-pointer"
