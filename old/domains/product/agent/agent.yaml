# Пакет одной задачи подготовки продуктовых требований.
format_version: "1"
id: product.capture-requirements
domain: product
instructions: AGENTS.md
executor:
  adapter: codex-cli
input:
  schema: input.schema.yaml
output:
  schema: output.schema.yaml
skills:
  - skills/capture-requirements/skill.yaml
gates:
  - id: input
    phase: before_run
    check: input_schema
  - id: output
    phase: before_complete
    check: output_schema
  - id: changed-paths
    phase: before_complete
    check: knowledge_changed_paths_allowed
    allowed: /allowed_changes
    proposal: /proposal
  - id: revision
    phase: before_complete
    check: knowledge_revision_valid
    skill: capture-requirements
    proposal: /proposal
