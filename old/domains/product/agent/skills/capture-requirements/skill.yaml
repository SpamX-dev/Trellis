# Авторская процедура одной задачи; схемы загружаются из состава продуктового домена.
name: capture-requirements
instructions: |-
  Сопоставь запрос с текущими требованиями на одной закреплённой ревизии.
  Раздели цели пользователя, поведение, качества, правила, процессы и предметные объекты.
  Сохраняй связи и источники; неизвестные сведения не подменяй догадками.
  Проверяй итоговый набор документов, включая ссылки между типами.
