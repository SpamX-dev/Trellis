# Схема документа product; тип принадлежит продуктовому домену.
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://trellis.local/framework/domains/product/schema/product.schema.yaml
type: object
additionalProperties: false
required:
  - id
  - type
  - name
  - purpose
  - boundary
properties:
  id:
    $ref: "../../../contracts/common.schema.yaml#/$defs/id"
  type:
    const: product
  name:
    type: string
    minLength: 1
    pattern: "\\S"
    description: "Краткое содержательное название документа."
  summary:
    type: string
    minLength: 1
    pattern: "\\S"
    description: "Краткое описание для чтения каталога и поиска."
  group:
    type: array
    uniqueItems: true
    description: "Имена смысловых групп для поиска и представления. Не являются ссылками на документы."
    items:
      type: string
      minLength: 1
      pattern: "\\S"
  sources:
    type: array
    minItems: 1
    items:
      $ref: "../../../contracts/common.schema.yaml#/$defs/source"
  gaps:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 1
      pattern: "\\S"
      description: "Явно неизвестный факт или открытый вопрос."
  purpose:
    type: string
    minLength: 1
    pattern: "\\S"
    description: "Для чего существует продукт."
  boundary:
    type: string
    minLength: 1
    pattern: "\\S"
    description: "Что входит в продукт и где заканчивается его ответственность."
description: "Граница продукта и ожидаемая польза."
x-trellis-checks:
  -
    id: product-boundary
    severity: error
    prompt: "Проверь, что назначение и граница продукта не противоречат друг другу; обозначь недостающий контекст."
