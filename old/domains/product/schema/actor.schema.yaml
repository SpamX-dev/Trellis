# Схема документа actor; тип принадлежит продуктовому домену.
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://trellis.local/framework/domains/product/schema/actor.schema.yaml
type: object
additionalProperties: false
required:
  - id
  - type
  - name
  - product_ref
  - responsibility
properties:
  id:
    $ref: "../../../contracts/common.schema.yaml#/$defs/id"
  type:
    const: actor
  name:
    type: string
    minLength: 1
    pattern: "\\S"
    description: "Краткое содержательное название документа."
  summary:
    type: string
    minLength: 1
    pattern: "\\S"
    description: "Краткое описание для чтения каталога и поиска."
  group:
    type: array
    uniqueItems: true
    description: "Имена смысловых групп для поиска и представления. Не являются ссылками на документы."
    items:
      type: string
      minLength: 1
      pattern: "\\S"
  sources:
    type: array
    minItems: 1
    items:
      $ref: "../../../contracts/common.schema.yaml#/$defs/source"
  gaps:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 1
      pattern: "\\S"
      description: "Явно неизвестный факт или открытый вопрос."
  product_ref:
    $ref: "../../../contracts/common.schema.yaml#/$defs/id"
    description: "Продукт, к которому относятся знания."
    x-trellis-ref:
      targets:
        - product
      relation: describes-product
  responsibility:
    type: string
    minLength: 1
    pattern: "\\S"
    description: "Роль и интерес участника; не конкретный человек."
description: "Роль человека или внешней системы относительно продукта."
