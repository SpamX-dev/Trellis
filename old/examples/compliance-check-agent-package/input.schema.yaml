# Вход ограничивает одну оценку продукта; права и ревизии задаются задачей Tasks.
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://trellis.local/framework/examples/compliance-check-agent-package/input.schema.yaml
title: "Область проверки продукта на комплаенс"
type: object
additionalProperties: false
required:
  - product_id
  - catalog_requirement_ids
  - read_domains
  - allowed_changes
properties:
  product_id:
    $ref: "../../contracts/common.schema.yaml#/$defs/id"
    description: "Единственный продукт, для которого составляются оценки."
  catalog_requirement_ids:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      $ref: "../../contracts/common.schema.yaml#/$defs/id"
    description: "Выбранные ограничения каталога; процедуры читаются по их ссылкам."
  read_domains:
    const:
      - product
      - compliance
      - compliance-check
    description: "Документы для чтения: продукт, каталог и существующие оценки."
  allowed_changes:
    type: object
    additionalProperties: false
    required:
      - paths
      - prefixes
    properties:
      paths:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: "^compliance-check/compliance-assessment/(?:[a-z0-9-]+/)*[A-Za-z0-9][A-Za-z0-9._-]*\\.yaml$"
        description: "Точные относительные пути документов, которые разрешено изменить."
      prefixes:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: "^compliance-check/compliance-assessment/(?:[a-z0-9-]+/)*$"
        description: "Префиксы каталогов с завершающим / для новых документов."
    anyOf:
      - properties:
          paths:
            type: array
            minItems: 1
      - properties:
          prefixes:
            type: array
            minItems: 1
