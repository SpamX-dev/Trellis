name: trellis-knowledge

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: knowledge
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: ${KNOWLEDGE_DB_PASSWORD:?Set KNOWLEDGE_DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U knowledge -d knowledge']
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      default:
        aliases:
          - knowledge-postgres

  api:
    build:
      context: ..
      dockerfile: trellis-knowledge/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: knowledge-postgres
      PGPORT: 5432
      PGDATABASE: knowledge
      PGUSER: knowledge
      PGPASSWORD: ${KNOWLEDGE_DB_PASSWORD:?Set KNOWLEDGE_DB_PASSWORD in .env}
      OIDC_ISSUER: http://localhost:8080/realms/trellis
      OIDC_AUDIENCE: trellis-api
      OIDC_JWKS_URL: http://keycloak:8080/realms/trellis/protocol/openid-connect/certs
      GIT_ROOT: /data/repositories
    volumes:
      - repositories-data:/data/repositories
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 10
    networks:
      - default
      - identity

  web:
    build:
      context: ..
      dockerfile: trellis-web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '127.0.0.1:8081:80'

volumes:
  postgres-data:
  repositories-data:

networks:
  identity:
    external: true
    name: trellis-identity_default
