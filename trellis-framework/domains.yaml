# Сборка доменов; пути относительно этого файла.
format_version: "1"
domains:
  product:
    schema: domains/product/schema.yaml
    agent: domains/product/agent.yaml
    render: domains/product/render.yaml
  compliance:
    schema: domains/compliance/schema.yaml
    agent: domains/compliance/agent.yaml
    render: domains/compliance/render.yaml
  compliance-check:
    schema: domains/compliance-check/schema.yaml
    agent: domains/compliance-check/agent.yaml
    render: domains/compliance-check/render.yaml
    on_change:
      - product
      - compliance
