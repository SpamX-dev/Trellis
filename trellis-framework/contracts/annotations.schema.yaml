# Аннотации Trellis в JSON Schema. Декларативный контракт; исполнение принадлежит Knowledge.
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://trellis.local/framework/contracts/annotations.schema.yaml
title: "Аннотации Trellis в JSON Schema"
$defs:
  reference:
    type: object
    additionalProperties: false
    required:
      - targets
      - relation
    properties:
      targets:
        type: array
        minItems: 1
        items:
          type: string
          minLength: 1
          pattern: "\\S"
        uniqueItems: true
      relation:
        type: string
        minLength: 1
        pattern: "\\S"
        description: "Имя направленной связи от документа к цели ссылки."
  checks:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required:
        - id
        - severity
        - prompt
      properties:
        id:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
        severity:
          type: string
          enum:
            - error
            - warning
          description: "Серьёзность находки; её наличие не является решением о принятии."
        prompt:
          type: string
          minLength: 1
          pattern: "\\S"
          description: "Содержательный критерий для автора и AI-проверяющего."
