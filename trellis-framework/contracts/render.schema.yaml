# Представление доменных документов. Декларативный контракт; исполнение принадлежит Knowledge.
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://trellis.local/framework/contracts/render.schema.yaml
title: "Представление доменных документов"
type: object
additionalProperties: false
required:
  - domain
  - types
properties:
  domain:
    type: string
    minLength: 1
    pattern: "\\S"
  types:
    type: object
    minProperties: 1
    additionalProperties:
      type: object
      additionalProperties: false
      required:
        - title
        - fields
      properties:
        title:
          type: string
          minLength: 1
          pattern: "\\S"
        fields:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
              - field
              - label
            properties:
              field:
                type: string
                minLength: 1
                pattern: "\\S"
                description: "Имя верхнеуровневого поля документа."
              label:
                type: string
                minLength: 1
                pattern: "\\S"
                description: "Подпись поля в представлении."
