# Комплаенс-ограничения и процедуры. Декларативный контракт; исполнение принадлежит Knowledge.
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://trellis.local/framework/domains/compliance/schema.yaml
title: "Комплаенс-ограничения и процедуры"
oneOf:
  -
    $ref: "#/$defs/compliance-requirement"
  -
    $ref: "#/$defs/verification-procedure"
$defs:
  compliance-requirement:
    type: object
    additionalProperties: false
    required:
      - id
      - type
      - name
      - kind
      - statement
      - area
      - source_kind
      - sources
    properties:
      id:
        $ref: "../../contracts/common.schema.yaml#/$defs/id"
      type:
        const: compliance-requirement
      name:
        type: string
        minLength: 1
        pattern: "\\S"
        description: "Краткое содержательное название документа."
      summary:
        type: string
        minLength: 1
        pattern: "\\S"
        description: "Краткое описание для чтения каталога и поиска."
      sources:
        type: array
        minItems: 1
        items:
          $ref: "../../contracts/common.schema.yaml#/$defs/source"
      gaps:
        type: array
        minItems: 1
        items:
          type: string
          minLength: 1
          pattern: "\\S"
          description: "Явно неизвестный факт или открытый вопрос."
      kind:
        type: string
        enum:
          - prohibition
          - conditional-obligation
        description: "Безусловный запрет либо обязанность, возникающая при выполнении trigger."
      statement:
        type: string
        minLength: 1
        pattern: "\\S"
        description: "Содержание запрета или обязанности."
      area:
        type: string
        minLength: 1
        pattern: "\\S"
        description: "Предметная область ограничения."
      source_kind:
        type: string
        enum:
          - law
          - regulation
          - standard
          - policy
        description: "Тип источника ограничения."
      trigger:
        type: string
        minLength: 1
        pattern: "\\S"
        description: "Условие применимости условного обязательства."
      procedure_refs:
        type: array
        minItems: 1
        items:
          $ref: "../../contracts/common.schema.yaml#/$defs/id"
          description: "Назначенные процедуры подтверждения."
          x-trellis-ref:
            targets:
              - verification-procedure
            relation: verified-by
        uniqueItems: true
        description: "Назначенные процедуры подтверждения."
    description: "Внешний запрет или условное обязательство пройти верификацию."
    x-trellis-checks:
      -
        id: compliance-source
        severity: error
        prompt: "Сопоставь формулировку с названным источником и областью действия. Недоступный источник означает недостаточность данных, а не достоверность ограничения."
    allOf:
      -
        if:
          properties:
            kind:
              const: conditional-obligation
          required:
            - kind
        then:
          required:
            - trigger
            - procedure_refs
          properties:
            trigger: {}
            procedure_refs: {}
      -
        if:
          properties:
            kind:
              const: prohibition
          required:
            - kind
        then:
          not:
            required:
              - trigger
            properties:
              trigger: {}
  verification-procedure:
    type: object
    additionalProperties: false
    required:
      - id
      - type
      - name
      - authority
      - instructions
      - expected_evidence
    properties:
      id:
        $ref: "../../contracts/common.schema.yaml#/$defs/id"
      type:
        const: verification-procedure
      name:
        type: string
        minLength: 1
        pattern: "\\S"
        description: "Краткое содержательное название документа."
      summary:
        type: string
        minLength: 1
        pattern: "\\S"
        description: "Краткое описание для чтения каталога и поиска."
      sources:
        type: array
        minItems: 1
        items:
          $ref: "../../contracts/common.schema.yaml#/$defs/source"
      gaps:
        type: array
        minItems: 1
        items:
          type: string
          minLength: 1
          pattern: "\\S"
          description: "Явно неизвестный факт или открытый вопрос."
      authority:
        type: string
        minLength: 1
        pattern: "\\S"
        description: "Кто или что вправе выполнить проверку."
      instructions:
        type: string
        minLength: 1
        pattern: "\\S"
        description: "Что проверяется и как получают результат."
      expected_evidence:
        type: string
        minLength: 1
        pattern: "\\S"
        description: "Какие материалы подтверждают фактическое выполнение процедуры."
    description: "Назначенный способ верификации; определение процедуры не является результатом её выполнения."
    x-trellis-checks:
      -
        id: procedure-evidence
        severity: error
        prompt: "Проверь, что процедура задаёт проверяемый результат и его источник; не принимай описание процедуры за свидетельство её выполнения."
