# Фрагмент границы продукта: сопоставление ограничений комплаенс с требованиями продукта.
# Повторяет узлы из ../model.yaml, кроме root.
nodes:
  - type: compliance-mapping
    propose: Сопоставление ограничения комплаенс с требованием продукта: фиксирует, какое требование дополняется, каким образом и на каком основании.
    required:
      - id: string
      - name: string
      - kind: [obligation, prohibition] # Характер дополнения: obligation (добавляемое обязательство верификации) или prohibition (накладываемый запрет)
      - compliance_ref: string # Ссылка на ограничение комплаенс (compliance-requirement)
      - requirement_ref: string # Ссылка на дополняемое требование продукта: functional-requirement, non-functional-requirement или business-object
      - basis: string # Основание сопоставления: признак, по которому ограничение относится к требованию (атрибут данных, функция, область действия)
    non_required:
      - summary: string # Краткое описание для поиска и навигации
    relations:
      - type: maps
        from: compliance-mapping
        to: compliance-requirement
      - type: supplements
        from: compliance-mapping
        to: functional-requirement
      - type: supplements
        from: compliance-mapping
        to: non-functional-requirement
      - type: supplements
        from: compliance-mapping
        to: business-object
