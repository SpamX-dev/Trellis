nodes:
  - type: non-functional-requirement
    propose: Критерий качества и ограничения нефункционального характера, применимые к продукту или его частям.
    required:
      - id: string
      - name: string
      - category: string # Категория требования
      - statement: string # Формулировка требования
      - metric: string # Критерий проверки
      - target_value: string # Целевое значение
    non_required:
      - summary: string # Краткое описание для поиска и навигации
      - verification_method: string
