# Декларативный каталог расширения Semantic Model: общие типы, связи и ограничения.
# Значения описывают контракт; файл не исполняет проверки и не задаёт транспорт API.
model: trellis.requirements-and-methods
version: '0.1'
common_fields: [id, revision]
external_types: [Project, EngineeringArea, WorkItem, ChangeSet, Evidence, GateDecision]

# Типы знаний и записей процесса. Конкретные экземпляры принадлежат examples или Knowledge.
node_types:
  # Исследование или обоснование имеет источник, но не получает нормативный статус автоматически.
  KnowledgeStatement:
    description: Наблюдение, исследовательский вывод или обоснование решения.
    required_fields: [statement, source_ref]
  # Обязательство содержит scope и исключения; принятие определяется ревизией Knowledge State.
  Requirement:
    description: Необходимое свойство системы в явно заданной области применимости.
    required_fields: [statement, applicability, exceptions, source_ref]
  # Control задаёт проверяемую цель без выбора конкретного технологического механизма.
  Control:
    description: Обеспечиваемое свойство и критерий проверки.
    required_fields: [objective, verification_criterion]
  # Общий способ реализации независим от факта его применения в каком-либо проекте.
  RealizationPattern:
    description: Способ обеспечения Control с условиями и ограничениями.
    required_fields: [approach, applicability, limitations, verification_contract]
  # Выбор в проекте привязывает общий способ к контексту, месту и версии реализации.
  ProjectRealization:
    description: Принятый способ реализации в конкретном проекте.
    required_fields: [project_ref, pattern_refs, context, enforcement_scope, implementation_ref, owner_area_ref]
  # Версия метода имеет собственное содержимое и точные нормативные зависимости.
  MethodArtifact:
    description: Управляемая версия навыка или другого метода работы и проверки.
    required_fields: [kind, applicability, owner_area_ref, requirement_refs, pattern_refs, artifact_ref, source_ref, verification_refs]
    optional_fields: [package_ref]
  # План предлагает работы и сохраняет пробелы; его принятие не принимает будущие результаты.
  ImpactPlan:
    description: Обоснованный план влияния изменения на методы и проекты.
    required_fields: [base_revision, requirement_before_ref, requirement_after_ref, delta, scope, items, unknowns]
  # Оценка относится к точным входам и одной размерности; актуальность вычисляется отдельно.
  CoverageAssessment:
    description: Проверяемый вывод о покрытии методами или выполнении требования в проекте.
    required_fields: [requirement_ref, dimension, scope, subject_refs, basis_refs, evidence_refs, result, gaps, rationale]
  # Подключение является подтверждённым фактом выбора версий для новых запусков.
  AdoptionRecord:
    description: Подтверждённое подключение версий методов к целевому проекту или среде.
    required_fields: [target_ref, previous_artifact_refs, selected_artifact_refs, decision_ref, effective_from]

# Связи описывают смысл путей анализа; множественность не равна доказательству выполнения.
relation_types:
  informs:
    from: [KnowledgeStatement]
    to: [RealizationPattern]
    description: Исследование или обоснование объясняет выбор способа, не становясь нормативным требованием.
  requires_control:
    from: [Requirement]
    to: [Control]
    description: Для требования необходимо обеспечить указанное свойство.
  realized_by:
    from: [Control]
    to: [RealizationPattern]
    description: Способ предназначен для обеспечения свойства при выполнении его предпосылок.
  selects_pattern:
    from: [ProjectRealization]
    to: [RealizationPattern]
    description: Реализация проекта выбирает общий способ с привязкой к контексту.
  maintained_by:
    from: [RealizationPattern]
    to: [MethodArtifact]
    description: Метод поддерживает проектирование, изменение или проверку способа реализации.
  constrained_by:
    from: [MethodArtifact]
    to: [Requirement]
    description: Содержимое версии метода сформировано с учётом данной ревизии требования.
  assesses_requirement:
    from: [CoverageAssessment]
    to: [Requirement]
    description: Оценка проверяет конкретную ревизию требования.
  supported_by:
    from: [CoverageAssessment]
    to: [Evidence]
    description: Вывод опирается на проверяемый материал в пределах указанной области.

# Словари значений используются и в каталоге, и в сценариях; новые значения меняют контракт.
enums:
  method_kind: [skill, validator, checklist, template, gate_policy]
  impact_action: [update, check, no_change]
  coverage_dimension: [methods, project]
  coverage_result: [covered, partial, uncovered, unknown, not_applicable]
  freshness: [current, needs_review]

# Ограничения требуют проверок в компонентах и содержательного review там, где нужно.
constraints:
  - id: exact-revisions
    rule: План, запуск, review и оценка сохраняют точные ссылки на входы и результаты.
  - id: independent-scopes
    rule: Объект требования, точка реализации и ответственная область задаются независимо.
  - id: impact-is-proposed
    rule: Путь в графе даёт кандидата влияния; решение об изменении требует обоснования и review.
  - id: unknown-is-visible
    rule: Неполные данные не допускают вывода об отсутствии влияния или о полном покрытии.
  - id: separate-coverage
    rule: Покрытие методами и выполнение в проекте имеют разные оценки и Evidence.
  - id: immutable-artifacts
    rule: Изменение содержимого требует новой версии; переоценка прежней версии не переписывает пакет.
  - id: separate-adoption
    rule: Публикация версии не подключает её и не заменяет навыки текущего запуска.
  - id: plan-does-not-approve-results
    rule: Одобрение плана разрешает работы; результат, публикация и подключение имеют собственные основания.
