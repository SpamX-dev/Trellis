nodes:
  - type: root
    required:
      - id: string
      - name: string
    relations:
      - type: contains
        from: root
        to: product

  - type: layer
    required:
      - id: string
        name: Product
    relations:      
      - type: contains
        from: layer
        to: product
      - type: contains
        from: layer
        to: compliance-requirement

  - type: group
    propose: Группировка сущностей по общему признаку.
    required:
      - id: string
      - name: string
    non_required:
      - summary: string # Краткое описание для поиска и навигации
    relations:
      - type: contains
        from: group
        to: group
      # Product
      - type: contains
        from: group
        to: user-story
      - type: contains
        from: group
        to: functional-requirement
      - type: contains
        from: group
        to: non-functional-requirement
      - type: contains
        from: group
        to: business-rule
      - type: contains
        from: group
        to: business-process
      - type: contains
        from: group
        to: business-object
      - type: contains
        from: group
        to: actor
      # Compliance
      - type: contains
        from: group
        to: compliance-requirement
      