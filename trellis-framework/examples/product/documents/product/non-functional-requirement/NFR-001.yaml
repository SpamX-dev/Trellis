id: "NFR-001"
type: non-functional-requirement
name: Время отправки запроса подтверждения
product_ref: "PRODUCT-001"
kind: performance
statement: Запрос подтверждения отправляется без длительного ожидания.
measure: Время от принятия команды до передачи сообщения почтовому сервису.
target: Не более 5 секунд для 95% запросов.
context: При нагрузке до 10 запросов в секунду и доступном почтовом сервисе.
